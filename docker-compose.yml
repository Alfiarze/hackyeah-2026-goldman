services:
  db:
    image: postgres:17-alpine
    container_name: goldman-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldman}
      POSTGRES_USER: ${POSTGRES_USER:-goldman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldman}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldman} -d ${POSTGRES_DB:-goldman}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build: .
    container_name: goldman-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tools:
        condition: service_started
      ollama:
        condition: service_started   # gateway starts at once; uses the local scorer until the model is pulled
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goldman}:${POSTGRES_PASSWORD:-goldman}@db:5432/${POSTGRES_DB:-goldman}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      POLICY_PATH: /app/policy/policy.yaml
      ATTACK_FEED_PATH: /app/feeds/attacks.yaml
      ATTACK_FEED_URL: ${ATTACK_FEED_URL:-}
      TOOLS_BASE_URL: http://tools:8001
      TOOL_BACKEND_SECRET: ${TOOL_BACKEND_SECRET:-dev-backend-secret}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      APP_API_KEY: ${APP_API_KEY:-dev-app-key}
      LEASE_SECRET: ${LEASE_SECRET:-dev-lease-secret}
      AGENT_KEYS: ${AGENT_KEYS:-agent-key-demo:demo-agent,agent-key-other:other-agent}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      # Mounted from host so jury edits are picked up by hot-reload without rebuild
      - ./policy:/app/policy
      - ./feeds:/app/feeds
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Mock tool backends / MCP server. Holds the counters that prove a blocked call never arrived.
  # Port published only so the jury can try a direct call: it is rejected without the gateway's secret.
  tools:
    build: .
    container_name: goldman-tools
    restart: unless-stopped
    command: ["uvicorn", "mandate.backends:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      TOOL_BACKEND_SECRET: ${TOOL_BACKEND_SECRET:-dev-backend-secret}
    ports:
      - "${TOOLS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s

  # Local LLM for the semantic guard and the agent console. Runs CPU-only inside Docker on macOS.
  # qwen2.5:3b needs ~3 GB of Docker memory (Docker Desktop > Settings > Resources > Memory >= 4 GB).
  # Faster on a Mac: run Ollama on the host instead and set OLLAMA_BASE_URL=http://host.docker.internal:11434
  ollama:
    image: ollama/ollama:latest
    container_name: goldman-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: downloads the model into the ollama volume on first start (cached afterwards).
  ollama-pull:
    image: ollama/ollama:latest
    container_name: goldman-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  db_data:
  ollama_data:
