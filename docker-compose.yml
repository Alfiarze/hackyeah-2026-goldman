services:
  db:
    image: postgres:17-alpine
    container_name: goldman-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldman}
      POSTGRES_USER: ${POSTGRES_USER:-goldman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldman}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldman} -d ${POSTGRES_DB:-goldman}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build: .
    container_name: goldman-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tools:
        condition: service_started
      sandbox:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goldman}:${POSTGRES_PASSWORD:-goldman}@db:5432/${POSTGRES_DB:-goldman}
      POLICY_PATH: /app/policy/policy.yaml
      ATTACK_FEED_PATH: /app/feeds/attacks.yaml
      ATTACK_FEED_URL: ${ATTACK_FEED_URL:-}
      TOOLS_BASE_URL: http://tools:8001
      TOOL_BACKEND_SECRET: ${TOOL_BACKEND_SECRET:-dev-backend-secret}
      SANDBOX_BASE_URL: http://sandbox:8002
      SANDBOX_SECRET: ${SANDBOX_SECRET:-dev-sandbox-secret}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      APP_API_KEY: ${APP_API_KEY:-dev-app-key}
      LEASE_SECRET: ${LEASE_SECRET:-dev-lease-secret}
      AGENT_KEYS: ${AGENT_KEYS:-agent-key-demo:demo-agent,agent-key-other:other-agent}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      LLM_LOCATION: ${LLM_LOCATION:-onprem}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      # Mounted from host so jury edits are picked up by hot-reload without rebuild
      - ./policy:/app/policy
      - ./feeds:/app/feeds

  # Sandbox runner: the ONLY service with Docker access. Runs code.run in a throw-away, no-network,
  # read-only, memory/CPU/pids-capped container, then removes it. Gateway talks to it over HTTP with a secret.
  sandbox:
    build: .
    container_name: goldman-sandbox
    restart: unless-stopped
    command: ["uvicorn", "mandate.sandbox:app", "--host", "0.0.0.0", "--port", "8002"]
    user: "0:0"   # needs the docker socket; this service only launches locked-down containers
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET:-dev-sandbox-secret}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # required to launch sibling containers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s

  # Mock tool backends / MCP server. Holds the counters that prove a blocked call never arrived.
  # Port published only so the jury can try a direct call: it is rejected without the gateway's secret.
  tools:
    build: .
    container_name: goldman-tools
    restart: unless-stopped
    command: ["uvicorn", "mandate.backends:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      TOOL_BACKEND_SECRET: ${TOOL_BACKEND_SECRET:-dev-backend-secret}
    ports:
      - "${TOOLS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s

  # Static landing page (optional, separate image). Start with: make landing  ->  http://localhost:8080
  landing:
    build:
      context: ./landing
      args:
        PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:8000/dashboard/}
    container_name: goldman-landing
    profiles: ["landing"]
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-8080}:80"

volumes:
  db_data:
