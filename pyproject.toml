[project]
name = "mandate"
version = "0.1.0"
description = "MANDATE - AI Control Layer: task-scoped security gateway for AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "watchfiles>=0.22",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandate*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
