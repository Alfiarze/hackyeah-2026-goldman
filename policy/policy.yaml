version: 1
profile: balanced
models:
  allow:
  - ollama/qwen2.5:3b
  - ollama/llama3.2:3b
  - mock/echo
  default: ollama/qwen2.5:3b
internal_domains:
- lawfirm.example
sinks:
  llm:local: SECRET
  notes.write: CONFIDENTIAL
  memory.write: CONFIDENTIAL
  mail.send:internal: CONFIDENTIAL
  mail.send:external: PUBLIC
  http.post: PUBLIC
  legal_db.search: INTERNAL
  code.run: INTERNAL
controls:
  mandate:
    enabled: true
  ifc_taint:
    enabled: true
  model_allowlist:
    enabled: true
  pii:
    enabled: true
    entities:
    - PESEL
    - CREDIT_CARD
    - IBAN
    - EMAIL
    - PHONE
  secrets:
    enabled: true
    mode: block
  attack_signatures:
    enabled: true
    mode: block
  injection_heuristics:
    enabled: true
  semantic:
    enabled: true
    backend: auto
    model: qwen2.5:3b
    on_error: block
    timeout_ms: 1500
budgets:
  default_max_tokens: 1024
  per_principal:
    tokens: 200000
    calls: 2000
    concurrency: 20
  global:
    tokens: 2000000
    calls: 20000
    concurrency: 100
  guard:
    tokens: 200000
    calls: 5000
  usd_per_1k_tokens: 0.002
task_profiles:
  contract_review:
    description: Analyse a client contract and write an internal risk memo
    resources:
    - /clients/{client}/*
    - /public/*
    tools:
    - doc.read
    - legal_db.search
    - notes.write
    - memory.read
    - memory.write
    - mail.send
    recipients_allow:
    - '*@lawfirm.example'
    - '*@client-{client}.example'
    budget:
      tokens: 20000
      calls: 30
      concurrency: 3
    ttl_seconds: 900
  research:
    description: Public legal research, no client data
    resources:
    - /public/*
    tools:
    - legal_db.search
    - http.post
    - notes.write
    budget:
      tokens: 10000
      calls: 20
      concurrency: 2
    ttl_seconds: 600
  simulation:
    description: Load test for the budget escrow (mock model)
    resources: []
    tools: []
    models:
    - mock/echo
    budget:
      tokens: 1000000
      calls: 1000
      concurrency: 100
    ttl_seconds: 300
profiles:
  strict:
    semantic:
      block_at_risk: 0.4
      redact_at_risk: 0.25
    pii:
      mode: block
    injection_heuristics:
      mode: block
  balanced:
    semantic:
      block_at_risk: 0.7
      redact_at_risk: 0.5
    pii:
      mode: redact
    injection_heuristics:
      mode: redact
  permissive:
    semantic:
      block_at_risk: 0.9
      redact_at_risk: 0.75
    pii:
      mode: redact
    injection_heuristics:
      mode: redact
